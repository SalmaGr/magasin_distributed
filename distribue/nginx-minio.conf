# Répartiteur de charge devant les 4 nœuds MinIO : le reste du projet continue d'utiliser http://minio:9000
events { worker_connections 4096; }
http {
  upstream minio_s3      { least_conn; server minio1:9000; server minio2:9000; server minio3:9000; server minio4:9000; }
  upstream minio_console { ip_hash;    server minio1:9001; server minio2:9001; server minio3:9001; server minio4:9001; }
  server {
    listen 9000;
    ignore_invalid_headers off; client_max_body_size 0; proxy_buffering off; proxy_request_buffering off;
    location / {
      proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 300; proxy_http_version 1.1; proxy_set_header Connection ""; chunked_transfer_encoding off;
      proxy_pass http://minio_s3;
    }
  }
  server {
    listen 9001;
    ignore_invalid_headers off; client_max_body_size 0; proxy_buffering off;
    location / {
      proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; chunked_transfer_encoding off;
      proxy_pass http://minio_console;
    }
  }
}
